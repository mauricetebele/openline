<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { --blue: #131921; --accent: #007ac0; }
    * { box-sizing: border-box; }
    body { font: 13px -apple-system, system-ui, sans-serif; margin: 0; width: 320px; color: #111; background: #fff; }
    header { background: var(--blue); color: #fff; padding: 10px 12px; }
    header h1 { font-size: 13px; margin: 0; font-weight: 700; }
    header p { font-size: 10px; margin: 2px 0 0; color: #b9c2cc; }
    .body { padding: 12px; }
    label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #667; display: block; margin-bottom: 4px; }
    input { width: 100%; height: 34px; border: 1px solid #cbd2d9; border-radius: 8px; padding: 0 10px; font: inherit; }
    button { height: 36px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; width: 100%; margin-top: 8px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .result { margin-top: 12px; }
    .note { background: #f6f8fa; border: 1px solid #e1e5ea; border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    .muted { color: #889; font-size: 11px; }
    .err { color: #b42318; font-size: 12px; }
    .copy { background: #eef1f4; color: #111; margin-top: 6px; }
    .cands { margin-top: 8px; font-size: 11px; }
    .cands div { padding: 4px 6px; border: 1px dashed #cbd2d9; border-radius: 6px; margin-top: 4px; cursor: pointer; }
    .settings { margin-top: 12px; border-top: 1px solid #eee; padding-top: 8px; }
    .settings summary { font-size: 11px; color: #667; cursor: pointer; }
    .settings input { height: 30px; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Seller Note Fetcher</h1>
    <p>Uses your logged-in Seller Central session.</p>
  </header>
  <div class="body">
    <label for="orderId">Amazon Order ID</label>
    <input id="orderId" placeholder="111-4056227-2695460" autocomplete="off" />
    <button id="go">Fetch Seller Note</button>

    <div class="result" id="result"></div>

    <details class="settings">
      <summary>Advanced: note CSS selector</summary>
      <input id="selector" placeholder="e.g. [data-testid='order-note'] .value" autocomplete="off" />
      <div class="muted" style="margin-top:4px">Set this once we know where the note renders; leave blank to auto-detect.</div>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
